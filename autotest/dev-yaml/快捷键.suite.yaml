name: "文件管理器快捷键自测"
app: "dde-file-manager"
module: "快捷键"
description: "键盘快捷键功能的快速自测"
tags: ["shortcut", "smoke"]

setup:
  - action: session_start
    command: "dde-file-manager"

teardown:
  - action: session_stop

specs:
  - id: shortcut_new_window
    name: "Ctrl+N 新建窗口"
    tags: ["shortcut", "window"]
    steps:
      - action: keyboard_hot_key
        keys: "Ctrl+N"
      - action: wait
        wait: 1.0

  - id: shortcut_new_tab
    name: "Ctrl+T 新建标签页"
    tags: ["shortcut", "tab"]
    steps:
      - action: keyboard_hot_key
        keys: "Ctrl+T"
      - action: wait
        wait: 0.5

  - id: shortcut_close_tab
    name: "Ctrl+W 关闭标签页"
    tags: ["shortcut", "tab"]
    steps:
      - action: keyboard_hot_key
        keys: "Ctrl+W"
      - action: wait
        wait: 0.5

  - id: shortcut_search
    name: "Ctrl+F 搜索"
    tags: ["shortcut", "search"]
    steps:
      - action: keyboard_hot_key
        keys: "Ctrl+F"
      - action: wait
        wait: 0.5
      - action: keyboard_press
        keys: "Escape"

  - id: shortcut_properties
    name: "Ctrl+I 属性"
    tags: ["shortcut"]
    steps:
      - action: keyboard_hot_key
        keys: "Ctrl+I"
      - action: wait
        wait: 0.5
      - action: keyboard_press
        keys: "Escape"

  - id: shortcut_back
    name: "Alt+Left 后退"
    tags: ["shortcut", "navigation"]
    steps:
      - action: keyboard_hot_key
        keys: "Alt+Left"
      - action: wait
        wait: 0.3

  - id: shortcut_forward
    name: "Alt+Right 前进"
    tags: ["shortcut", "navigation"]
    steps:
      - action: keyboard_hot_key
        keys: "Alt+Right"
      - action: wait
        wait: 0.3

  - id: shortcut_up
    name: "Alt+Up 上级目录"
    tags: ["shortcut", "navigation"]
    steps:
      - action: keyboard_hot_key
        keys: "Alt+Up"
      - action: wait
        wait: 0.3

  - id: shortcut_address_bar
    name: "Ctrl+L 地址栏"
    tags: ["shortcut"]
    steps:
      - action: keyboard_hot_key
        keys: "Ctrl+L"
      - action: wait
        wait: 0.3
      - action: keyboard_press
        keys: "Escape"

  - id: shortcut_refresh
    name: "F5 刷新"
    tags: ["shortcut"]
    steps:
      - action: keyboard_press
        keys: "F5"
      - action: wait
        wait: 0.3
