name: "文件管理器菜单操作自测"
app: "dde-file-manager"
module: "菜单"
description: "主菜单和右键菜单的快速自测"
tags: ["menu", "smoke"]

setup:
  - action: session_start
    command: "dde-file-manager"

teardown:
  - action: session_stop

specs:
  - id: menu_file_new_window
    name: "菜单-文件-新建窗口"
    tags: ["menu", "file"]
    steps:
      - action: main_menu_comb
        items: ["文件", "新建窗口"]
      - action: wait
        wait: 1.0

  - id: menu_file_new_tab
    name: "菜单-文件-新建标签页"
    tags: ["menu", "file", "tab"]
    steps:
      - action: main_menu_comb
        items: ["文件", "新建标签页"]
      - action: wait
        wait: 0.5

  - id: menu_file_close_tab
    name: "菜单-文件-关闭标签页"
    tags: ["menu", "file", "tab"]
    steps:
      - action: main_menu_comb
        items: ["文件", "关闭标签页"]
      - action: wait
        wait: 0.5

  - id: menu_edit_select_all
    name: "菜单-编辑-全选"
    tags: ["menu", "edit"]
    steps:
      - action: main_menu_comb
        items: ["编辑", "全选"]
      - action: wait
        wait: 0.3

  - id: menu_edit_preferences
    name: "菜单-编辑-设置"
    tags: ["menu", "edit", "settings"]
    steps:
      - action: main_menu_comb
        items: ["编辑", "设置"]
      - action: wait
        wait: 0.5
      - action: keyboard_press
        keys: "Escape"

  - id: menu_view_icon
    name: "菜单-视图-图标视图"
    tags: ["menu", "view"]
    steps:
      - action: main_menu_comb
        items: ["视图", "图标视图"]
      - action: wait
        wait: 0.5

  - id: menu_view_list
    name: "菜单-视图-列表视图"
    tags: ["menu", "view"]
    steps:
      - action: main_menu_comb
        items: ["视图", "列表视图"]
      - action: wait
        wait: 0.5

  - id: menu_help_about
    name: "菜单-帮助-关于"
    tags: ["menu", "help"]
    steps:
      - action: main_menu_comb
        items: ["帮助", "关于"]
      - action: wait
        wait: 0.5
      - action: keyboard_press
        keys: "Escape"

  - id: context_menu_open
    name: "右键菜单-打开"
    tags: ["menu", "context"]
    steps:
      - action: mouse_right_click
        x: 400
        y: 300
      - action: wait
        wait: 0.5
      - action: keyboard_press
        keys: "Escape"

  - id: context_menu_new_folder
    name: "右键菜单-新建文件夹"
    tags: ["menu", "context"]
    steps:
      - action: mouse_right_click
        x: 400
        y: 300
      - action: wait
        wait: 0.3
      - action: mouse_click
        selector: {name: "新建文件夹"}
      - action: wait
        wait: 0.5
