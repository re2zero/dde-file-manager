name: 专业版水印功能自测
app: dde-file-manager
module: 专业版水印
status: draft
description: 文管专业版水印功能自测套件（需要特定授权环境）
tags:
  - 功能测试
  - license

env_check:
  - type: process
    name: dde-file-manager
    expect: running

setup:
  - action: session_start
    command: dde-file-manager

teardown:
  - action: session_stop

specs:
  # 水印检查（需要特定授权）
  - id: watermark_trial
    name: 试用期水印检查
    tags: [license]
    skip: "需要试用期授权状态"
    steps:
      - action: wait
        wait: 0.5

  - id: watermark_authorized
    name: 已授权水印检查
    tags: [license]
    skip: "需要已授权状态"
    steps:
      - action: wait
        wait: 0.5

  - id: watermark_enterprise
    name: 企业版水印检查
    tags: [license]
    skip: "需要企业版授权"
    steps:
      - action: wait
        wait: 0.5

  - id: watermark_government
    name: 政务版水印检查
    tags: [license]
    skip: "需要政务版授权"
    steps:
      - action: wait
        wait: 0.5

  - id: watermark_custom
    name: 自定义水印检查
    tags: [license]
    skip: "需要组策略配置自定义水印"
    steps:
      - action: wait
        wait: 0.5
