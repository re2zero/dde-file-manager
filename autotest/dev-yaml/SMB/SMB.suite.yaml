name: SMB功能自测
app: dde-file-manager
module: SMB
status: draft
description: 文管SMB网络共享功能自测套件
tags:
  - 功能测试
  - network
  - smb

setup:
  - action: session_start
    command: dde-file-manager

teardown:
  - action: session_stop

specs:
  # 连接服务器
  - id: smb_connect
    name: 连接到服务器对话框
    tags: [smb, network]
    steps:
      - action: element_action
        selector: {role: "push button", name: "DTitlebarDWindowOptionButton"}
        do: click
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "连接到服务器"}
        do: click
      - action: wait
        wait: 0.5
      - action: keyboard_press
        keys: Escape
      - action: wait
        wait: 0.3

  - id: smb_connect_smb
    name: 连接SMB服务器
    tags: [smb, network]
    skip: "需要SMB服务器环境"
    steps:
      - action: element_action
        selector: {role: "push button", name: "DTitlebarDWindowOptionButton"}
        do: click
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "连接到服务器"}
        do: click
      - action: wait
        wait: 0.5
      - action: keyboard_type
        text: smb://localhost/share
      - action: wait
        wait: 0.3
      - action: keyboard_press
        keys: Return
      - action: wait
        wait: 1.0

  # 设置共享密码
  - id: smb_set_password
    name: 设置共享密码
    tags: [smb, network]
    skip: "需要SMB服务配置权限"
    steps:
      - action: element_action
        selector: {role: "push button", name: "DTitlebarDWindowOptionButton"}
        do: click
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "设置共享密码"}
        do: click
      - action: wait
        wait: 0.5
      - action: keyboard_press
        keys: Escape
      - action: wait
        wait: 0.3

  # 共享操作
  - id: smb_share_folder
    name: 右键共享文件夹到SMB
    tags: [smb, network]
    skip: "需要SMB服务配置权限"
    steps:
      - action: mouse_right_click
        x: 400
        y: 300
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "共享到SMB"}
        do: click
      - action: wait
        wait: 0.5

  # 网络邻居
  - id: smb_network_neighbors
    name: 查看网络邻居
    tags: [smb, network]
    skip: "需要网络环境"
    steps:
      - action: wait
        wait: 0.5
