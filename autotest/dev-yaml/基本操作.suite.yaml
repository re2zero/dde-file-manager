name: "文件管理器基本操作自测"
app: "dde-file-manager"
module: "基本操作"
description: "文件管理器核心功能的快速自测套件"
tags: ["smoke", "core"]

setup:
  - action: session_start
    command: "dde-file-manager"

teardown:
  - action: session_stop

specs:
  - id: nav_home
    name: "导航到主目录"
    tags: ["navigation", "smoke"]
    steps:
      - action: keyboard_hot_key
        keys: "Ctrl+H"
      - action: wait
        wait: 0.5

  - id: nav_desktop
    name: "导航到桌面"
    tags: ["navigation"]
    steps:
      - action: keyboard_hot_key
        keys: "Ctrl+D"
      - action: wait
        wait: 0.5

  - id: create_folder
    name: "新建文件夹"
    tags: ["file_operation", "smoke"]
    steps:
      - action: keyboard_hot_key
        keys: "Ctrl+Shift+N"
      - action: wait
        wait: 0.5
      - action: keyboard_type
        text: "test_folder"
      - action: keyboard_press
        keys: "Return"
      - action: wait
        wait: 0.5

  - id: rename_file
    name: "重命名文件"
    tags: ["file_operation"]
    steps:
      - action: keyboard_press
        keys: "F2"
      - action: wait
        wait: 0.3
      - action: keyboard_type
        text: "renamed"
      - action: keyboard_press
        keys: "Return"
      - action: wait
        wait: 0.3

  - id: copy_file
    name: "复制文件"
    tags: ["file_operation"]
    steps:
      - action: keyboard_hot_key
        keys: "Ctrl+C"
      - action: wait
        wait: 0.3

  - id: paste_file
    name: "粘贴文件"
    tags: ["file_operation"]
    steps:
      - action: keyboard_hot_key
        keys: "Ctrl+V"
      - action: wait
        wait: 0.5

  - id: delete_file
    name: "删除文件到回收站"
    tags: ["file_operation"]
    steps:
      - action: keyboard_press
        keys: "Delete"
      - action: wait
        wait: 0.5

  - id: select_all
    name: "全选文件"
    tags: ["selection"]
    steps:
      - action: keyboard_hot_key
        keys: "Ctrl+A"
      - action: wait
        wait: 0.3

  - id: context_menu
    name: "打开右键菜单"
    tags: ["menu"]
    steps:
      - action: mouse_right_click
        x: 400
        y: 300
      - action: wait
        wait: 0.5
      - action: keyboard_press
        keys: "Escape"
