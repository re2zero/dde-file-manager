name: 桌面整理功能自测
app: dde-file-manager
module: 桌面整理
status: draft
description: 文管桌面整理功能自测套件
tags:
  - 功能测试
  - desktop

setup:
  - action: session_start
    command: dde-file-manager

teardown:
  - action: session_stop

specs:
  # 桌面整理开关
  - id: desktop_organize_enable
    name: 开启桌面整理
    tags: [desktop]
    steps:
      - action: mouse_right_click
        x: 100
        y: 100
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "开启桌面整理"}
        do: click
      - action: wait
        wait: 0.5

  - id: desktop_organize_disable
    name: 关闭桌面整理
    tags: [desktop]
    steps:
      - action: mouse_right_click
        x: 100
        y: 100
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "关闭桌面整理"}
        do: click
      - action: wait
        wait: 0.5

  # 集合操作
  - id: collection_create
    name: 创建集合
    tags: [desktop]
    skip: "需要开启桌面整理"
    steps:
      - action: wait
        wait: 0.5

  - id: collection_resize
    name: 调整集合大小
    tags: [desktop]
    skip: "需要开启桌面整理并有集合"
    steps:
      - action: wait
        wait: 0.5

  - id: collection_drag
    name: 拖动集合
    tags: [desktop]
    skip: "需要开启桌面整理并有集合"
    steps:
      - action: wait
        wait: 0.5

  # 整理操作
  - id: organize_now
    name: 立即整理
    tags: [desktop]
    skip: "需要开启桌面整理"
    steps:
      - action: mouse_right_click
        x: 100
        y: 100
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "整理桌面"}
        do: click
      - action: wait
        wait: 0.5
