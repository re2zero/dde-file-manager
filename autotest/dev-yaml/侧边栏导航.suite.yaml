name: "文件管理器侧边栏导航自测"
app: "dde-file-manager"
module: "导航"
description: "侧边栏和导航功能的快速自测"
tags: ["navigation", "smoke"]

setup:
  - action: session_start
    command: "dde-file-manager"

teardown:
  - action: session_stop

specs:
  - id: nav_sidebar_home
    name: "侧边栏点击主目录"
    tags: ["navigation", "sidebar"]
    steps:
      - action: mouse_click
        selector: {name: "主目录"}
      - action: wait
        wait: 0.5

  - id: nav_sidebar_desktop
    name: "侧边栏点击桌面"
    tags: ["navigation", "sidebar"]
    steps:
      - action: mouse_click
        selector: {name: "桌面"}
      - action: wait
        wait: 0.5

  - id: nav_sidebar_videos
    name: "侧边栏点击视频"
    tags: ["navigation", "sidebar"]
    steps:
      - action: mouse_click
        selector: {name: "视频"}
      - action: wait
        wait: 0.5

  - id: nav_sidebar_music
    name: "侧边栏点击音乐"
    tags: ["navigation", "sidebar"]
    steps:
      - action: mouse_click
        selector: {name: "音乐"}
      - action: wait
        wait: 0.5

  - id: nav_sidebar_pictures
    name: "侧边栏点击图片"
    tags: ["navigation", "sidebar"]
    steps:
      - action: mouse_click
        selector: {name: "图片"}
      - action: wait
        wait: 0.5

  - id: nav_sidebar_documents
    name: "侧边栏点击文档"
    tags: ["navigation", "sidebar"]
    steps:
      - action: mouse_click
        selector: {name: "文档"}
      - action: wait
        wait: 0.5

  - id: nav_sidebar_downloads
    name: "侧边栏点击下载"
    tags: ["navigation", "sidebar"]
    steps:
      - action: mouse_click
        selector: {name: "下载"}
      - action: wait
        wait: 0.5

  - id: nav_sidebar_trash
    name: "侧边栏点击回收站"
    tags: ["navigation", "trash"]
    steps:
      - action: mouse_click
        selector: {name: "回收站"}
      - action: wait
        wait: 0.5

  - id: nav_address_bar
    name: "地址栏输入路径"
    tags: ["navigation", "address"]
    steps:
      - action: keyboard_hot_key
        keys: "Ctrl+L"
      - action: wait
        wait: 0.3
      - action: keyboard_type
        text: "/tmp"
      - action: keyboard_press
        keys: "Return"
      - action: wait
        wait: 0.5
