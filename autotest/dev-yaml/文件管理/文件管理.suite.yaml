name: 文件管理功能自测
app: dde-file-manager
module: 文件管理
status: ready
description: 文管文件管理功能自测套件
tags:
  - 功能测试
  - smoke
  - management

setup:
  - action: session_start
    command: dde-file-manager

teardown:
  - action: session_stop

specs:
  # 标签页管理
  - id: tab_new
    name: 标签页-新建
    tags: [management, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+T
      - action: wait
        wait: 0.5

  - id: tab_close
    name: 标签页-关闭
    tags: [management, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+W
      - action: wait
        wait: 0.3

  - id: tab_next
    name: 标签页-切换到下一个
    tags: [management, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+Tab
      - action: wait
        wait: 0.3

  - id: tab_prev
    name: 标签页-切换到上一个
    tags: [management, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+Shift+Tab
      - action: wait
        wait: 0.3

  # 窗口管理
  - id: window_new
    name: 窗口-新建
    tags: [management, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+N
      - action: wait
        wait: 0.5

  - id: window_close
    name: 窗口-关闭
    tags: [management, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+Q
      - action: wait
        wait: 0.3

  # 导航
  - id: nav_back
    name: 导航-后退
    tags: [management, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Alt+Left
      - action: wait
        wait: 0.3

  - id: nav_forward
    name: 导航-前进
    tags: [management, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Alt+Right
      - action: wait
        wait: 0.3

  - id: nav_up
    name: 导航-上级目录
    tags: [management, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Alt+Up
      - action: wait
        wait: 0.3

  - id: nav_home
    name: 导航-主目录
    tags: [management, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Alt+Home
      - action: wait
        wait: 0.3

  # 地址栏
  - id: address_bar_focus
    name: 地址栏-聚焦
    tags: [management, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+L
      - action: wait
        wait: 0.3
      - action: keyboard_press
        keys: Escape
      - action: wait
        wait: 0.2

  # 刷新
  - id: refresh
    name: 刷新当前目录
    tags: [management, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+R
      - action: wait
        wait: 0.3

  # 显示隐藏文件
  - id: toggle_hidden
    name: 切换显示隐藏文件
    tags: [management, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+H
      - action: wait
        wait: 0.3
