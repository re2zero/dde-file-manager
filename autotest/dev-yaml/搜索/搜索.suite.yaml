name: 搜索功能自测
app: dde-file-manager
module: 搜索
status: ready
description: 文管搜索功能自测套件
tags:
  - 功能测试
  - smoke
  - search

setup:
  - action: session_start
    command: dde-file-manager

teardown:
  - action: session_stop

specs:
  # 快捷键激活搜索
  - id: search_activate
    name: 快捷键激活搜索框
    tags: [search, smoke, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+F
      - action: wait
        wait: 0.5

  - id: search_input
    name: 搜索输入测试
    tags: [search, smoke]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+F
      - action: wait
        wait: 0.3
      - action: keyboard_type
        text: test
      - action: wait
        wait: 0.5
      - action: keyboard_press
        keys: Escape
      - action: wait
        wait: 0.3

  - id: search_clear
    name: 搜索清空
    tags: [search]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+F
      - action: wait
        wait: 0.3
      - action: keyboard_type
        text: test
      - action: wait
        wait: 0.3
      - action: keyboard_hot_key
        keys: Ctrl+A
      - action: wait
        wait: 0.1
      - action: keyboard_press
        keys: BackSpace
      - action: wait
        wait: 0.3

  # 搜索过滤选项
  - id: search_filter_all_subfolders
    name: 搜索过滤-所有子文件夹
    tags: [search]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+F
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "list item", name: "所有子文件夹"}
        do: click
      - action: wait
        wait: 0.3

  - id: search_filter_current_folder
    name: 搜索过滤-当前文件夹
    tags: [search]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+F
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "list item", name: "当前文件夹"}
        do: click
      - action: wait
        wait: 0.3

  # 文件类型过滤
  - id: search_filter_type_video
    name: 搜索过滤-视频类型
    tags: [search]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+F
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "list item", name: "视频"}
        do: click
      - action: wait
        wait: 0.3

  - id: search_filter_type_audio
    name: 搜索过滤-音频类型
    tags: [search]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+F
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "list item", name: "音频"}
        do: click
      - action: wait
        wait: 0.3

  - id: search_filter_type_image
    name: 搜索过滤-图片类型
    tags: [search]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+F
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "list item", name: "图片"}
        do: click
      - action: wait
        wait: 0.3

  - id: search_filter_type_document
    name: 搜索过滤-文档类型
    tags: [search]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+F
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "list item", name: "文档"}
        do: click
      - action: wait
        wait: 0.3
