name: 文件操作功能自测
app: dde-file-manager
module: 文件操作
status: ready
description: 文管文件操作功能自测套件，使用真实AT-SPI选择器
tags:
  - 功能测试
  - smoke
  - file

setup:
  - action: session_start
    command: dde-file-manager

teardown:
  - action: session_stop

specs:
  - id: file_copy
    name: 快捷键-复制文件
    tags: [file, shortcut]
    steps:
      - action: element_action
        selector: {role: "table cell", name: "testfile.txt"}
        do: click
      - action: wait
        wait: 0.2
      - action: keyboard_hot_key
        keys: Ctrl+C
      - action: wait
        wait: 0.3
    assert:
      - type: window_amount
        app: dde-file-manager
        number: 1

  - id: file_cut
    name: 快捷键-剪切文件
    tags: [file, shortcut]
    steps:
      - action: element_action
        selector: {role: "table cell", name: "testfile.txt"}
        do: click
      - action: wait
        wait: 0.2
      - action: keyboard_hot_key
        keys: Ctrl+X
      - action: wait
        wait: 0.3
    assert:
      - type: window_amount
        app: dde-file-manager
        number: 1

  - id: file_paste
    name: 快捷键-粘贴文件
    tags: [file, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+V
      - action: wait
        wait: 0.3
    assert:
      - type: window_amount
        app: dde-file-manager
        number: 1

  - id: file_select_all
    name: 快捷键-全选
    tags: [file, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+A
      - action: wait
        wait: 0.3
    assert:
      - type: window_amount
        app: dde-file-manager
        number: 1

  - id: file_delete
    name: 快捷键-删除到回收站
    tags: [file, shortcut]
    steps:
      - action: element_action
        selector: {role: "table cell", name: "testfile.txt"}
        do: click
      - action: wait
        wait: 0.2
      - action: keyboard_press
        keys: Delete
      - action: wait
        wait: 0.3
    assert:
      - type: window_amount
        app: dde-file-manager
        number: 1

  - id: file_permanent_delete
    name: 快捷键-永久删除
    tags: [file, shortcut]
    steps:
      - action: element_action
        selector: {role: "table cell", name: "testfile.txt"}
        do: click
      - action: wait
        wait: 0.2
      - action: keyboard_hot_key
        keys: Shift+Delete
      - action: wait
        wait: 0.3
    assert:
      - type: window_amount
        app: dde-file-manager
        number: 1

  - id: file_rename
    name: 快捷键-重命名
    tags: [file, shortcut]
    steps:
      - action: element_action
        selector: {role: "table cell", name: "testfile.txt"}
        do: click
      - action: wait
        wait: 0.2
      - action: keyboard_press
        keys: F2
      - action: wait
        wait: 0.3
      - action: keyboard_press
        keys: Escape
      - action: wait
        wait: 0.2
    assert:
      - type: window_amount
        app: dde-file-manager
        number: 1

  - id: file_properties
    name: 快捷键-查看属性
    tags: [file, shortcut]
    steps:
      - action: element_action
        selector: {role: "table cell", name: "testfile.txt"}
        do: click
      - action: wait
        wait: 0.2
      - action: keyboard_hot_key
        keys: Ctrl+I
      - action: wait
        wait: 0.5
      - action: keyboard_press
        keys: Escape
      - action: wait
        wait: 0.3
    assert:
      - type: window_amount
        app: dde-file-manager
        number: 1

  - id: file_show_hidden
    name: 快捷键-显示隐藏文件
    tags: [file, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+H
      - action: wait
        wait: 0.3
    assert:
      - type: window_amount
        app: dde-file-manager
        number: 1

  - id: file_context_menu
    name: 右键菜单-打开
    tags: [file, menu]
    steps:
      - action: element_action
        selector: {role: "table cell", name: "testfile.txt"}
        do: right_click
      - action: wait
        wait: 0.3
    assert:
      - type: window_amount
        app: dde-file-manager
        number: 1

  - id: file_context_open_terminal
    name: 右键菜单-在终端中打开
    tags: [file, menu]
    steps:
      - action: element_action
        selector: {role: "panel"}
        do: right_click
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "在终端中打开"}
        do: click
    assert:
      - type: window_amount
        app: dde-file-manager
        number: 1
      - action: wait
        wait: 0.5

  - id: file_context_new_folder
    name: 右键菜单-新建文件夹
    tags: [file, menu]
    steps:
      - action: element_action
        selector: {role: "panel"}
        do: right_click
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "新建文件夹"}
        do: click
      - action: wait
        wait: 0.5
      - action: keyboard_press
        keys: Escape
      - action: wait
        wait: 0.2

  - id: file_send_to_desktop
    name: 右键菜单-发送到桌面
    tags: [file, menu]
    steps:
      - action: element_action
        selector: {role: "table cell", name: "testfile.txt"}
        do: right_click
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "发送到桌面"}
        do: click
      - action: wait
        wait: 0.5
