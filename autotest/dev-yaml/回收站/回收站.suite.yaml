name: 回收站功能自测
app: dde-file-manager
module: 回收站
status: ready
description: 文管回收站功能自测套件
tags:
  - 功能测试
  - smoke
  - trash

setup:
  - action: session_start
    command: dde-file-manager

teardown:
  - action: session_stop

specs:
  # 快捷键操作
  - id: trash_shortcut_delete
    name: 快捷键-删除文件到回收站
    tags: [trash, shortcut]
    steps:
      - action: keyboard_press
        keys: Delete
      - action: wait
        wait: 0.3

  - id: trash_shortcut_restore
    name: 快捷键-Ctrl+Z撤销删除
    tags: [trash, shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+Z
      - action: wait
        wait: 0.3

  # 右键菜单操作
  - id: trash_context_menu
    name: 回收站右键菜单
    tags: [trash, menu]
    steps:
      - action: mouse_right_click
        x: 400
        y: 300
      - action: wait
        wait: 0.3

  - id: trash_restore
    name: 右键菜单-还原
    tags: [trash, menu]
    steps:
      - action: mouse_right_click
        x: 400
        y: 300
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "还原"}
        do: click
      - action: wait
        wait: 0.5

  - id: trash_delete_permanent
    name: 右键菜单-彻底删除
    tags: [trash, menu]
    steps:
      - action: mouse_right_click
        x: 400
        y: 300
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "彻底删除"}
        do: click
      - action: wait
        wait: 0.5

  - id: trash_empty
    name: 右键菜单-清空回收站
    tags: [trash, menu]
    steps:
      - action: mouse_right_click
        x: 400
        y: 300
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "清空回收站"}
        do: click
      - action: wait
        wait: 0.5
