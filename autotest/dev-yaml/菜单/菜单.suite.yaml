name: 菜单功能自测
app: dde-file-manager
module: 菜单
status: ready
description: 文管主菜单功能自测套件，使用真实AT-SPI选择器
tags:
  - 功能测试
  - smoke
  - menu

setup:
  - action: session_start
    command: dde-file-manager

teardown:
  - action: session_stop

specs:
  # 主菜单操作
  - id: menu_new_window
    name: 主菜单-新建窗口
    tags: [menu, smoke]
    steps:
      - action: element_action
        selector: {role: "push button", name: "DTitlebarDWindowOptionButton"}
        do: click
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "新建窗口"}
        do: click
      - action: wait
        wait: 1.0

  - id: menu_new_tab
    name: 主菜单-新建标签页
    tags: [menu, smoke]
    steps:
      - action: element_action
        selector: {role: "push button", name: "DTitlebarDWindowOptionButton"}
        do: click
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "新建标签页"}
        do: click
      - action: wait
        wait: 0.5

  - id: menu_connect_server
    name: 主菜单-连接到服务器
    tags: [menu]
    steps:
      - action: element_action
        selector: {role: "push button", name: "DTitlebarDWindowOptionButton"}
        do: click
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "连接到服务器"}
        do: click
      - action: wait
        wait: 0.5
      - action: keyboard_press
        keys: Escape
      - action: wait
        wait: 0.3

  - id: menu_settings
    name: 主菜单-设置
    tags: [menu]
    steps:
      - action: element_action
        selector: {role: "push button", name: "DTitlebarDWindowOptionButton"}
        do: click
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "设置"}
        do: click
      - action: wait
        wait: 0.5
      - action: keyboard_press
        keys: Escape
      - action: wait
        wait: 0.3

  # 主题切换
  - id: menu_theme_light
    name: 主菜单-主题-浅色
    tags: [menu, theme]
    steps:
      - action: element_action
        selector: {role: "push button", name: "DTitlebarDWindowOptionButton"}
        do: click
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "主题"}
        do: click
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "浅色"}
        do: click
      - action: wait
        wait: 0.5

  - id: menu_theme_dark
    name: 主菜单-主题-深色
    tags: [menu, theme]
    steps:
      - action: element_action
        selector: {role: "push button", name: "DTitlebarDWindowOptionButton"}
        do: click
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "主题"}
        do: click
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "深色"}
        do: click
      - action: wait
        wait: 0.5

  # 帮助菜单
  - id: menu_help
    name: 主菜单-帮助
    tags: [menu]
    steps:
      - action: element_action
        selector: {role: "push button", name: "DTitlebarDWindowOptionButton"}
        do: click
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "帮助"}
        do: click
      - action: wait
        wait: 0.5
      - action: keyboard_press
        keys: Escape
      - action: wait
        wait: 0.3

  - id: menu_about
    name: 主菜单-关于
    tags: [menu, smoke]
    steps:
      - action: element_action
        selector: {role: "push button", name: "DTitlebarDWindowOptionButton"}
        do: click
      - action: wait
        wait: 0.3
      - action: element_action
        selector: {role: "menu item", name: "关于"}
        do: click
      - action: wait
        wait: 0.5
      - action: keyboard_press
        keys: Escape
      - action: wait
        wait: 0.3

  # 快捷键操作
  - id: shortcut_new_window
    name: 快捷键-Ctrl+N新建窗口
    tags: [shortcut, smoke]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+N
      - action: wait
        wait: 0.5
    assert:
      - type: window_amount
        app: dde-file-manager
        number: 2

  - id: shortcut_new_tab
    name: 快捷键-Ctrl+T新建标签页
    tags: [shortcut, smoke]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+T
      - action: wait
        wait: 0.5
    assert:
      - type: window_amount
        app: dde-file-manager
        number: 1

  - id: shortcut_close_tab
    name: 快捷键-Ctrl+W关闭标签页
    tags: [shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+W
      - action: wait
        wait: 0.3
    assert:
      - type: window_amount
        app: dde-file-manager
        number: 1

  - id: shortcut_search
    name: 快捷键-Ctrl+F搜索
    tags: [shortcut]
    steps:
      - action: keyboard_hot_key
        keys: Ctrl+F
      - action: wait
        wait: 0.3
      - action: keyboard_press
        keys: Escape
      - action: wait
        wait: 0.2
    assert:
      - type: window_amount
        app: dde-file-manager
        number: 1
